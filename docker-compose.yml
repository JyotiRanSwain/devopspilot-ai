
# DevOpsPilot AI
# Start: docker compose up -d --build

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - default
    restart: unless-stopped

  dashboard:
    build: .
    depends_on:
      - docker-proxy
      - ollama
    environment:
      DOP_HOST: 0.0.0.0
      DOP_API_TOKEN: ${DOP_API_TOKEN:?Set DOP_API_TOKEN in .env}
      DOP_DOCKER_HOST: tcp://docker-proxy:2375
      DOP_DB_PATH: /srv/data/devopspilot.db
      DOP_ALLOWED_ORIGINS: ${DOP_ALLOWED_ORIGINS:?Set DOP_ALLOWED_ORIGINS in .env}
      DOP_LOG_MAX_LINES: ${DOP_LOG_MAX_LINES:-1000}

      DOP_AI_PROVIDER: ${DOP_AI_PROVIDER:-openai}
      DOP_AI_MODEL: ${DOP_AI_MODEL:-gemma4:e2b}
      DOP_AI_BASE_URL: ${DOP_AI_BASE_URL:-http://ollama:11434/v1}
      DOP_AI_API_KEY: ${DOP_AI_API_KEY:-ollama}
      DOP_AI_TIMEOUT_SECONDS: ${DOP_AI_TIMEOUT_SECONDS:-120}

      DOP_AWS_ENABLED: ${DOP_AWS_ENABLED:-false}
      DOP_AWS_REGION: ${DOP_AWS_REGION:-}
      DOP_AWS_PROFILE: ${DOP_AWS_PROFILE:-}
    ports:
      - "8000:8000"
    volumes:
      - pilot-data:/srv/data
    networks:
      - internal
      - default
    restart: unless-stopped

  mcp:
    profiles:
      - mcp
    build: .
    command:
      - python
      - -m
      - app.mcp.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    depends_on:
      - docker-proxy
    environment:
      DOP_DOCKER_HOST: tcp://docker-proxy:2375
      DOP_DB_PATH: /srv/data/devopspilot.db
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - pilot-data:/srv/data
    networks:
      - internal
      - default
    restart: unless-stopped

networks:
  internal:
    internal: true

volumes:
  pilot-data:
  ollama-data:
